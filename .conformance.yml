# conformance-kit: what daisyui is held to (see its README). `bundle exec
# conformance-kit check` runs what the conformance workflow runs.
audit:
  require: [./spec/conformance_eager_load.rb]
  namespace: [DaisyUI]
  strict_autoloads: true
ractor:
  test_command: bundle exec rspec --tag ractor
probes:
  gem_name: daisyui
main_only:
  - name: DaisyUI::Calendar.@__registered_elements__
    reason: >-
      Phlex's own class state: register_element records Calendar's custom
      elements here in the class body, on the main Ractor, and Phlex never
      reads a component's copy (tag() reads only its own StandardElements and
      VoidElements). Rendering in a non-main Ractor waits on Phlex anyway
      (yippee-fun/phlex#1055).
